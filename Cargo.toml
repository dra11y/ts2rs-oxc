[package]
name = "ts2rs-oxc"
description = "Crate to convert TypeScript types to Rust types using the OXC project"
repository = "https://github.com/dra11y/ts2rs-oxc"
version = "0.1.0"
edition = "2024"

[dependencies]
codegen = "0.2.0"
convert_case = "0.8.0"
derive_builder = "0.20.2"
itertools = "0.14.0"
lazy_static = "1.5.0"
oxc_allocator = { version = "0.54.0", features = [
    "serialize",
] }
oxc_ast = { version = "0.54.0", features = ["serialize"] }
oxc_ast_visit = { version = "0.54.0", features = ["serialize"] }
oxc_codegen = "0.54.0"
oxc_diagnostics = "0.54.0"
oxc_parser = "0.54.0"
oxc_resolver = "4.2.0"
oxc_semantic = "0.54.0"
oxc_span = { version = "0.54.0", features = [
    "serialize",
] }
oxc_syntax = "0.54.0"
pico-args = "0.5.0"
serde = { version = "1.0.218", features = [
    "derive",
] }
serde_json = "1.0.140"
